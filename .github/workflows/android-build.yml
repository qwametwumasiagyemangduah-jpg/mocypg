name: Android app build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - 'manifest.webmanifest'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Check Android project files
        run: |
          echo "Checking for a generated Bubblewrap Android project..."
          if [ ! -f android-app/gradlew ] && [ ! -f android-app/gradlew.bat ]; then
            echo "No generated Gradle project found in android-app."
            echo "A Bubblewrap project must be initialized before this workflow can build an APK/AAB."
            exit 1
          fi
      - name: Build unsigned Android artifacts for initial validation
        working-directory: android-app
        run: npx --yes @bubblewrap/cli build --manifest=twa-manifest.json --skipSigning
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-unsigned
          path: |
            android-app/app-release-unsigned.apk
            android-app/app-release-bundle.aab
          if-no-files-found: warn
          retention-days: 14
