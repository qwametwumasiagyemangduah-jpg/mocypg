name: Build MoC YPG Android test app

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/twa-manifest.json"
      - "android-app/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Avoid the retired SDK "tools" package. Install the exact packages below.
          packages: ''

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Bubblewrap to use the runner's installed Android tools
        run: |
          mkdir -p "$HOME/.bubblewrap"
          # Bubblewrap's legacy SDK validator expects tools/bin/sdkmanager.
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"
          ls -l "$ANDROID_HOME/tools/bin/sdkmanager"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Generate Android project files from the saved TWA configuration
        working-directory: android-app
        run: bubblewrap update --manifest=twa-manifest.json --skipVersionUpgrade

      - name: Create temporary signing key for device testing
        working-directory: android-app
        env:
          TEST_KEYSTORE_PASSWORD: ${{ secrets.MOCYPG_TEST_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$TEST_KEYSTORE_PASSWORD" ]; then
            echo "MOCYPG_TEST_KEYSTORE_PASSWORD is not configured. Creating a temporary key for this test build only."
            TEST_KEYSTORE_PASSWORD="$(openssl rand -base64 24)"
          fi
          keytool -genkeypair -v \
            -keystore moc-ypg.keystore \
            -storepass "$TEST_KEYSTORE_PASSWORD" \
            -keypass "$TEST_KEYSTORE_PASSWORD" \
            -alias mocypg \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MoC YPG Test, OU=Youth Parliament Ghana, O=Youth Parliament Ghana, L=Kumasi, ST=Ashanti, C=GH" \
            -noprompt
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$TEST_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$TEST_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed test APK and App Bundle
        working-directory: android-app
        run: bubblewrap build --manifest=twa-manifest.json --signingKeyPath=./moc-ypg.keystore --signingKeyAlias=mocypg --skipPwaValidation

      - name: Upload Android test build
        uses: actions/upload-artifact@v4
        with:
          name: moc-ypg-android-test-build
          path: |
            android-app/app-release-signed.apk
            android-app/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 7
